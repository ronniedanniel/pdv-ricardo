<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesas</title>
<link rel="stylesheet" href="css/style.css?v=2.9">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <h2 id="bar-name">Bar do Ricardo</h2>
    <small>Sistema PDV</small>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-group">Principal</div>
    <a class="nav-link" href="index.html"><i class="icon">🏠</i> Dashboard</a>
    <a class="nav-link" href="pdv.html"><i class="icon">🛒</i> PDV / Venda</a>
    <a class="nav-link active" href="mesas.html"><i class="icon">🪑</i> Mesas</a>
    <div class="nav-group">Gestão</div>
    <a class="nav-link" href="produtos.html"><i class="icon">📦</i> Produtos</a>
    <a class="nav-link" href="estoque.html"><i class="icon">📊</i> Estoque</a>
    <a class="nav-link" href="caixa.html"><i class="icon">💰</i> Caixa</a>
    <a class="nav-link" href="relatorios.html"><i class="icon">📈</i> Relatórios</a>
    <div class="nav-group">Gestão</div>
    <a class="nav-link" href="clientes.html"><i class="icon">👥</i> Clientes</a>
    <div class="nav-group">Sistema</div>
    <a class="nav-link" href="configuracoes.html"><i class="icon">⚙️</i> Configurações</a>
  </nav>
</aside>

<div class="main">
  <div class="topbar">
    <h1>Mesas</h1>
    <div class="topbar-right">
      <button class="btn btn-secondary btn-sm" onclick="openAddTableModal()">+ Nova Mesa / Cliente</button>
    </div>
  </div>

  <div class="content">
    <div class="card mb-16" style="padding:12px 16px;">
      <div class="flex items-center" style="gap:16px;font-size:13px;">
        <div class="flex items-center" style="gap:6px;"><span style="width:12px;height:12px;border-radius:3px;background:var(--bg4);border:2px solid var(--border);display:inline-block;"></span> Livre</div>
        <div class="flex items-center" style="gap:6px;"><span style="width:12px;height:12px;border-radius:3px;background:rgba(245,158,11,.1);border:2px solid var(--accent);display:inline-block;"></span> Ocupada</div>
        <div style="margin-left:auto;color:var(--text2);">Clique na mesa para abrir o PDV</div>
      </div>
    </div>

    <div class="tables-grid" id="tables-grid"></div>
  </div>
</div>

<!-- Modal: Adicionar Mesa / Cliente -->
<div class="modal-overlay" id="modal-add-table">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="add-table-title">Nova Mesa / Cliente</h3>
      <button class="btn btn-ghost btn-sm" onclick="closeModal('modal-add-table')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-table-id">
      <div class="form-group">
        <label>Tipo</label>
        <select id="table-type" onchange="toggleTableTypeFields()" style="width: 100%; padding: 8px 10px; background: var(--bg3); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px;">
          <option value="table">Mesa Física</option>
          <option value="client">Cliente Avulso (Sem Mesa)</option>
          <option value="registered">Cliente Cadastrado</option>
        </select>
      </div>
      <div id="table-fields-row" class="form-row form-row-2">
        <div class="form-group">
          <label>Número da Mesa</label>
          <input type="number" id="table-number" min="1" placeholder="1">
        </div>
        <div class="form-group">
          <label>Capacidade</label>
          <input type="number" id="table-capacity" min="1" value="4" placeholder="4">
        </div>
      </div>
      <div class="form-group" id="registered-client-row" style="display:none;">
        <label>Cliente Cadastrado *</label>
        <select id="registered-client-select" style="width: 100%; padding: 8px 10px; background: var(--bg3); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px;">
          <!-- Carregado dinamicamente -->
        </select>
      </div>
      <div class="form-group" id="label-group">
        <label id="label-field-title">Nome/Rótulo (opcional)</label>
        <input type="text" id="table-label" placeholder="Ex: Varanda, Área Externa...">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-add-table')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveTable()">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal: Ver mesa ocupada -->
<div class="modal-overlay" id="modal-table-detail">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="detail-title">Mesa</h3>
      <button class="btn btn-ghost btn-sm" onclick="closeModal('modal-table-detail')">✕</button>
    </div>
    <div class="modal-body">
      <div id="detail-items"></div>
      <div class="divider"></div>
      <div class="flex items-center justify-between">
        <span style="font-size:15px;font-weight:600;">Total</span>
        <strong style="font-size:20px;color:var(--accent);" id="detail-total">R$ 0,00</strong>
      </div>
    </div>
    <div class="modal-footer" id="detail-footer"></div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="modal-overlay" id="modal-confirm">
  <div class="modal-box" style="max-width:360px;">
    <div class="modal-body" style="text-align:center;padding:30px 20px;">
      <div style="font-size:36px;margin-bottom:12px;">❓</div>
      <p id="confirm-msg" style="font-size:15px;margin-bottom:20px;"></p>
      <div class="flex" style="gap:10px;justify-content:center;">
        <button class="btn btn-secondary" onclick="closeModal('modal-confirm')">Cancelar</button>
        <button class="btn btn-danger" id="confirm-yes">Confirmar</button>
      </div>
    </div>
  </div>
</div>

<script src="js/db.js?v=3.0"></script>
<script src="js/utils.js?v=2.3"></script>
<script>
let editingTableId = null;

async function init() {
  await initDB();
  await seedInitialData();
  const barName = await dbGetSetting('bar_name', 'Bar do Ricardo');
  document.getElementById('bar-name').textContent = barName;
  activePage();
  await loadTables();
}

async function loadTables() {
  const allTables = await dbGetAll('tables');
  const allCustomers = await dbGetAll('customers');
  const registeredNames = new Set(allCustomers.map(c => c.name.toLowerCase().trim()));
  
  // Sort physical tables by number, and client tables alphabetically by label
  const physicalTables = allTables.filter(t => t.number !== 0 && t.type !== 'client').sort((a, b) => a.number - b.number);
  const clientTables = allTables.filter(t => t.type === 'client').sort((a, b) => (a.label || '').localeCompare(b.label || ''));
  const tables = [...physicalTables, ...clientTables];
  
  const el = document.getElementById('tables-grid');

  if (!tables.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">🪑</div><p>Nenhuma mesa ou cliente cadastrado</p></div>';
    return;
  }

  const orderTotals = {};
  const orderMap = {};
  for (const t of tables) {
    if (t.status === 'occupied') {
      const order = await getOpenOrderByTable(t.id);
      if (order) {
        const items = await getOrderItems(order.id);
        orderTotals[t.id] = items.reduce((s, i) => s + i.price * i.qty, 0);
        orderMap[t.id] = order;
      }
    }
  }

  el.innerHTML = tables.map(t => {
    const order = orderMap[t.id];
    const customerName = order && order.customerName ? order.customerName : '';
    
    if (t.type === 'client') {
      const isRegistered = registeredNames.has((t.label || '').toLowerCase().trim());
      const clientTypeLabel = isRegistered ? 'Cliente Cadastrado' : 'Cliente Avulso';
      return `
      <div class="table-card occupied" onclick="tableClick(${t.id}, '${t.status}')" style="display:flex; flex-direction:column; justify-content:space-between; min-height:160px; background:rgba(245,158,11,.05); border-color:var(--accent);">
        <div>
          <div class="t-icon">👤 ${clientTypeLabel}</div>
          <div class="t-num" style="font-size:18px; line-height:1.2; margin:12px 0 8px 0; word-break:break-all; color:var(--text);">${t.label}</div>
        </div>
        <div>
          ${orderTotals[t.id] !== undefined
            ? `<div class="t-total" style="font-size:16px; font-weight:700; color:var(--accent);">${fmt(orderTotals[t.id])}</div>`
            : `<div class="t-total" style="font-size:16px; font-weight:700; color:var(--accent);">${fmt(0)}</div>`}
          <div style="margin-top:12px;display:flex;gap:4px;justify-content:center;">
            <button class="btn btn-ghost btn-sm" style="font-size:11px;padding:3px 8px;" onclick="editTable(event,${t.id})">✏️</button>
            <button class="btn btn-ghost btn-sm" style="font-size:11px;padding:3px 8px;" onclick="deleteTable(event,${t.id},'${t.status}')" title="Excluir cliente">🗑️</button>
          </div>
        </div>
      </div>`;
    }
    
    return `
    <div class="table-card ${t.status}" onclick="tableClick(${t.id}, '${t.status}')">
      <div class="t-icon">${t.status === 'occupied' ? '🔴' : '🟢'}</div>
      <div class="t-num">${t.number}</div>
      <div class="t-label">${t.label || ('Mesa ' + t.number)}</div>
      ${customerName ? `<div style="font-size:11px;color:var(--accent);font-weight:600;margin-top:3px;">👤 ${customerName}</div>` : ''}
      ${t.status === 'occupied' && orderTotals[t.id] !== undefined
        ? `<div class="t-total">${fmt(orderTotals[t.id])}</div>`
        : `<div class="t-label" style="margin-top:4px;">${t.capacity} lugares</div>`}
      <div style="margin-top:8px;display:flex;gap:4px;justify-content:center;">
        <button class="btn btn-ghost btn-sm" style="font-size:11px;padding:3px 8px;" onclick="editTable(event,${t.id})">✏️</button>
        <button class="btn btn-ghost btn-sm" style="font-size:11px;padding:3px 8px;" onclick="deleteTable(event,${t.id},'${t.status}')" title="Excluir mesa">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

async function tableClick(tableId, status) {
  if (status === 'occupied') {
    await showTableDetail(tableId);
  } else {
    window.location.href = `pdv.html?mesa=${tableId}`;
  }
}

async function showTableDetail(tableId) {
  const table = await dbGet('tables', tableId);
  const order = await getOpenOrderByTable(tableId);
  if (!order) return;
  const items = await getOrderItems(order.id);
  const total = items.reduce((s, i) => s + i.price * i.qty, 0);

  document.getElementById('detail-title').textContent = table.label || 'Mesa ' + table.number;
  document.getElementById('detail-total').textContent = fmt(total);
  document.getElementById('detail-items').innerHTML = items.length
    ? items.map(i => `
        <div class="flex items-center justify-between" style="padding:6px 0;border-bottom:1px solid var(--border);">
          <span style="font-size:13px;">${i.qty}x ${i.name}${i.note ? ' <em style="color:var(--text3);font-size:11px;">(' + i.note + ')</em>' : ''}</span>
          <span style="color:var(--accent);font-size:13px;font-weight:600;">${fmt(i.price * i.qty)}</span>
        </div>
      `).join('')
    : '<div class="empty-state"><p>Nenhum item</p></div>';

  document.getElementById('detail-footer').innerHTML = `
    <button class="btn btn-danger btn-sm" style="margin-right:auto;" onclick="cancelOrderAndFreeTable(${tableId})">❌ Cancelar Pedido</button>
    <button class="btn btn-secondary btn-sm" onclick="closeModal('modal-table-detail')">Fechar</button>
    <a href="pdv.html?mesa=${tableId}" class="btn btn-primary btn-sm">Abrir no PDV</a>
  `;
  openModal('modal-table-detail');
}

function editTable(e, id) {
  e.stopPropagation();
  dbGet('tables', id).then(async t => {
    editingTableId = id;
    document.getElementById('add-table-title').textContent = t.type === 'client' ? 'Editar Cliente' : 'Editar Mesa';
    setVal('edit-table-id', id);
    setVal('table-type', t.type || 'table');
    setVal('table-number', t.number || '');
    setVal('table-capacity', t.capacity || 4);
    setVal('table-label', t.label || '');
    
    // Carrega clientes cadastrados
    const customers = await dbGetAll('customers');
    customers.sort((a, b) => a.name.localeCompare(b.name));
    const select = document.getElementById('registered-client-select');
    if (select) {
      if (customers.length === 0) {
        select.innerHTML = '<option value="">Nenhum cliente cadastrado</option>';
      } else {
        select.innerHTML = '<option value="">-- Selecione um Cliente --</option>' + 
          customers.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      }
      
      // Tenta selecionar o cliente cadastrado pelo nome se for type client
      if (t.type === 'client') {
        const match = customers.find(c => c.name === t.label);
        if (match) {
          setVal('table-type', 'registered');
          setVal('registered-client-select', match.id);
        }
      }
    }

    toggleTableTypeFields();
    openModal('modal-add-table');
  });
}

function deleteTable(e, id, status) {
  e.stopPropagation();
  const msg = status === 'occupied' 
    ? 'Esta mesa está OCUPADA! Excluir a mesa irá cancelar o pedido atual e apagar a mesa permanentemente. Deseja continuar?' 
    : 'Excluir esta mesa permanentemente?';
    
  confirm(msg, async () => {
    if (status === 'occupied') {
      const order = await getOpenOrderByTable(id);
      if (order) {
        const items = await getOrderItems(order.id);
        for (const item of items) {
          await dbDelete('order_items', item.id);
        }
        await dbDelete('orders', order.id);
      }
    }
    await dbDelete('tables', id);
    toast('Mesa removida');
    await loadTables();
  });
}

async function cancelOrderAndFreeTable(tableId) {
  closeModal('modal-table-detail');
  const table = await dbGet('tables', tableId);
  const msg = table && table.type === 'client'
    ? 'Cancelar o pedido atual e remover este cliente?'
    : 'Cancelar o pedido atual e liberar esta mesa?';
    
  confirm(msg, async () => {
    const order = await getOpenOrderByTable(tableId);
    if (order) {
      const items = await getOrderItems(order.id);
      for (const item of items) {
        await dbDelete('order_items', item.id);
      }
      await dbDelete('orders', order.id);
    }
    if (table) {
      if (table.type === 'client') {
        await dbDelete('tables', tableId);
      } else {
        table.status = 'free';
        await dbPut('tables', table);
      }
    }
    toast(table && table.type === 'client' ? 'Cliente avulso removido e pedido cancelado' : 'Mesa liberada e pedido cancelado');
    await loadTables();
  });
}

async function openAddTableModal() {
  editingTableId = null;
  document.getElementById('add-table-title').textContent = 'Nova Mesa / Cliente';
  setVal('edit-table-id', '');
  setVal('table-type', 'table');
  setVal('table-number', '');
  setVal('table-capacity', '4');
  setVal('table-label', '');
  
  // Carrega clientes cadastrados
  const customers = await dbGetAll('customers');
  customers.sort((a, b) => a.name.localeCompare(b.name));
  const select = document.getElementById('registered-client-select');
  if (select) {
    if (customers.length === 0) {
      select.innerHTML = '<option value="">Nenhum cliente cadastrado</option>';
    } else {
      select.innerHTML = '<option value="">-- Selecione um Cliente --</option>' + 
        customers.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    }
  }

  toggleTableTypeFields();
  openModal('modal-add-table');
}

function toggleTableTypeFields() {
  const type = val('table-type');
  const fieldsRow = document.getElementById('table-fields-row');
  const labelTitle = document.getElementById('label-field-title');
  const labelInput = document.getElementById('table-label');
  const labelGroup = document.getElementById('label-group');
  const registeredRow = document.getElementById('registered-client-row');
  
  if (type === 'client') {
    if (fieldsRow) fieldsRow.style.display = 'none';
    if (registeredRow) registeredRow.style.display = 'none';
    if (labelGroup) labelGroup.style.display = '';
    if (labelTitle) labelTitle.textContent = 'Nome do Cliente *';
    if (labelInput) {
      labelInput.placeholder = 'Ex: João, Marcos...';
      labelInput.required = true;
    }
  } else if (type === 'registered') {
    if (fieldsRow) fieldsRow.style.display = 'none';
    if (registeredRow) registeredRow.style.display = '';
    if (labelGroup) labelGroup.style.display = 'none';
  } else {
    // 'table'
    if (fieldsRow) fieldsRow.style.display = 'flex';
    if (registeredRow) registeredRow.style.display = 'none';
    if (labelGroup) labelGroup.style.display = '';
    if (labelTitle) labelTitle.textContent = 'Nome/Rótulo (opcional)';
    if (labelInput) {
      labelInput.placeholder = 'Ex: Varanda, Área Externa...';
      labelInput.required = false;
    }
  }
}

async function saveTable() {
  const type = val('table-type') || 'table';
  let number = null;
  let capacity = 4;
  let label = '';

  if (type === 'table') {
    number = parseInt(val('table-number'));
    capacity = parseInt(val('table-capacity')) || 4;
    label = val('table-label').trim();
    if (!number || number < 1) { toast('Informe o número da mesa', 'error'); return; }
  } else if (type === 'registered') {
    const select = document.getElementById('registered-client-select');
    const selectedOption = select.options[select.selectedIndex];
    label = selectedOption ? selectedOption.text : '';
    if (!select.value || label.startsWith('--')) { toast('Selecione um cliente cadastrado', 'error'); return; }
  } else {
    // type === 'client'
    label = val('table-label').trim();
    if (!label) { toast('Informe o nome do cliente', 'error'); return; }
  }

  // Se for type 'registered', salvamos na base como type 'client'
  const finalType = (type === 'registered') ? 'client' : type;

  const id = editingTableId;
  if (id) {
    const t = await dbGet('tables', id);
    await dbPut('tables', { ...t, type: finalType, number, capacity, label });
    toast(finalType === 'client' ? 'Cliente atualizado' : 'Mesa atualizada');
  } else {
    const status = finalType === 'client' ? 'occupied' : 'free';
    const newId = await dbAdd('tables', { type: finalType, number, capacity, label, status });
    toast(finalType === 'client' ? 'Cliente criado' : 'Mesa criada');
    
    if (finalType === 'client') {
      // Auto open order and redirect
      await dbAdd('orders', { tableId: newId, status: 'open', customerName: label, createdAt: new Date().toISOString() });
      editingTableId = null;
      closeModal('modal-add-table');
      window.location.href = `pdv.html?mesa=${newId}`;
      return;
    }
  }
  editingTableId = null;
  closeModal('modal-add-table');
  await loadTables();
}

document.getElementById('modal-add-table').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal('modal-add-table');
});

init();
</script>
</body>
</html>
